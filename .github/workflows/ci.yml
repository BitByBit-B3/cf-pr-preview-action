name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Verify dist is up to date
        run: |
          bun run build
          if ! git diff --quiet -- dist/index.cjs; then
            echo "::error::dist/index.cjs is out of date. Run 'bun run build' and commit."
            git diff --stat -- dist/index.cjs
            exit 1
          fi
