name: Release

# Publish flow: push a semver tag (e.g. v1.2.3) → verify → GitHub Release →
# float the major tag (v1) so consumers pinning @v1 get the new version.
# GitHub Marketplace serves the Release, so a published listing updates from here.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify dist is up to date
        run: |
          bun run build
          if ! git diff --quiet -- dist/index.cjs; then
            echo "::error::dist/index.cjs is out of date. Run 'bun run build' and commit before tagging."
            git diff --stat -- dist/index.cjs
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Float major version tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"   # v1.2.3 -> v1
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
