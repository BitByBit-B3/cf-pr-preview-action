# Drop this into a consuming B3 repo at .github/workflows/preview.yml
#
# Prereqs in the consuming repo:
#   - wrangler.jsonc with an `env.main` block (or set config-env to yours)
#   - GitHub environment/secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#     (token scopes: Workers Scripts edit, D1 edit, KV edit, R2 edit, Workers subdomain read)
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install

      # Deploy on open/sync/reopen, teardown on close — the action auto-detects.
      - uses: BitByBit-B3/cf-pr-preview-action@v1
        id: preview
        with:
          worker-prefix: neo-project-labor-tracker-poc-preview
          db-prefix: neo-labor-preview
          # Run anything you want against the isolated per-PR D1 after deploy:
          post-deploy-command: |
            $WRANGLER_COMMAND d1 execute "$PREVIEW_DB" --config "$PREVIEW_CONFIG" --remote --file ./seed/preview-seed.sql
            echo "seeded preview db $PREVIEW_DB at $PREVIEW_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Outputs are available for any further steps you want to add.
      - if: steps.preview.outputs.url
        run: echo "Preview at ${{ steps.preview.outputs.url }}"
